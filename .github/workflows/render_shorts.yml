name: Universal Physics Video Renderer

on:
  push:
    branches: [main]
    paths:
      - "request.txt"  # Triggers ONLY when you edit request.txt
      - ".github/workflows/render_shorts.yml"
      - "*.py"
  workflow_dispatch:  # Allows you to click "Run workflow" manually

permissions:
  contents: read

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Gives up to 2 hours for rendering

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, LaTeX, Cairo, Pango, Audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            texlive texlive-latex-extra texlive-fonts-extra \
            texlive-latex-recommended texlive-science tipa espeak-ng

      - name: Install PyTorch (CPU-only for rendering environment)
        run: |
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pypdf google-generativeai

      - name: Generate and Render Videos
        env:
          SAEM_GENERATION_PROVIDER: "gemini_provider:create_provider"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAEM_VOICE_REFERENCE: "saem_voice_sample.wav"
          HF_HOME: ${{ github.workspace }}/.hf_cache
        run: |
          # Ensure output directory exists
          mkdir -p generated
          
          # 1. Generate Plan using YOUR request.txt file
          python request_pipeline.py \
            --request "$(cat request.txt)" \
            --preferences '{"orientation":"horizontal", "language":"en", "quality":"1080p", "audio_direction":"calm, clear narration, no music", "visual_direction":"pure black background, color-coded vectors, morphing equations."}' \
            --output generated/physics.plan.json
          
          # 2. Convert to CSV
          python output_pipeline.py generated/physics.plan.json \
            --csv-output generated/physics.csv
          
          # 3. Render Videos
          # Using --draft and espeak for fast, CPU-friendly rendering
          python batch_runner.py \
            --csv generated/physics.csv \
            --draft \
            --voice-backend espeak

      - name: Upload Rendered Videos
        uses: actions/upload-artifact@v4
        with:
          name: physics-videos
          path: output_shorts/
          retention-days: 5
