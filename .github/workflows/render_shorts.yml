name: Universal Physics Video Renderer

on:
  push:
    branches: [main]
    paths:
      - "request.txt"
      - ".github/workflows/render_shorts.yml"
      - "*.py"
      - "requirements.txt"
      - "gemini_provider.py"
      - "local_provider.py"
      - "knowledge_matrix.csv"
      - "book_sources.csv"
      - "problem_matrix.csv"
  workflow_dispatch:
    inputs:
      provider:
        description: "AI provider for script generation"
        type: choice
        options: [gemini, local]
        default: gemini
      draft:
        description: "Render in draft mode (faster, 480p15)"
        type: boolean
        default: true

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Split request.txt into matrix entries
  # ─────────────────────────────────────────────────────────────────────────────
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.split.outputs.matrix }}
      count:    ${{ steps.split.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: split
        name: Split request.txt (Filtering out comments and blank lines)
        run: |
          python - <<'PY'
          import json, os
          lines = [ln.strip() for ln in open("request.txt", encoding="utf-8")
                   if ln.strip() and not ln.lstrip().startswith("#")]
          matrix = [{"index": i, "request": ln} for i, ln in enumerate(lines)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"count={len(matrix)}\n")
          print(f"Prepared {len(matrix)} request(s) for parallel rendering.")
          PY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Phase 1 - The Brains (LLM + Math Engines)
  # ─────────────────────────────────────────────────────────────────────────────
  generate-plan:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3 # Prevents API rate limits and resource exhaustion
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.requests) }}
    env:
      SAEM_GENERATION_PROVIDER: ${{ (github.event.inputs.provider == 'local' || secrets.GEMINI_API_KEY == '') && 'local_provider:create_provider' || 'gemini_provider:create_provider' }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Plan-Generation Dependencies (Lightweight)
        # CRITICAL FIX: We DO NOT install manim or TTS here. 
        # request_pipeline.py only needs numpy/scipy for the math engines and pypdf for the matrix.
        # This completely bypasses the manimpango/Cairo compilation crash.
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.12.0 pypdf google-genai tqdm

      - name: Fail-fast provider sanity check
        run: |
          python - <<PY
          import importlib, os
          spec = os.environ.get("SAEM_GENERATION_PROVIDER", "")
          mod, _, fac = spec.partition(":")
          ok = bool(mod) and bool(fac) and callable(getattr(importlib.import_module(mod), fac, None))
          print(f"provider spec: {spec!r} -> {'OK' if ok else 'BROKEN'}")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Generate Plan
        env:
          REQUEST_TEXT: ${{ matrix.request }} # Passed via env to prevent Bash injection
        run: |
          mkdir -p generated
          python request_pipeline.py \
            --request "$REQUEST_TEXT" \
            --preferences '{"orientation":"horizontal","language":"en","quality":"1080p","audio_direction":"calm, clear narration","visual_direction":"3b1b minimalist geometry"}' \
            --output "generated/plan-${{ matrix.index }}.json"

      - name: Dry-run Validation (Adapter CSV generation)
        run: |
          python output_pipeline.py "generated/plan-${{ matrix.index }}.json" \
            --csv-output "generated/render-${{ matrix.index }}.csv" \
            --dry-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-${{ matrix.index }}
          path: generated/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Phase 2 - The Muscle (Manim + TTS + FFmpeg)
  # ─────────────────────────────────────────────────────────────────────────────
  render:
    needs: [prepare-matrix, generate-plan]
    if: ${{ !cancelled() && needs.generate-plan.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2 # Rendering is CPU/RAM intensive (XTTS needs ~4GB RAM)
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.requests) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Required for Manim & TTS)
        # manimpango needs libcairo2-dev and libpango1.0-dev to compile.
        # Manim needs texlive for LaTeX equations. Coqui TTS needs sox/libsndfile1.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive texlive-latex-extra texlive-fonts-extra \
            texlive-latex-recommended texlive-science tipa \
            espeak-ng sox libsndfile1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace Models (XTTS-v2 ~2 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-xtts-v2-${{ runner.os }}
          restore-keys: hf-xtts-v2-

      - name: Install PyTorch (CPU) + Full Python Requirements
        run: |
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Generated Plan & CSV
        uses: actions/download-artifact@v4
        with:
          name: plan-${{ matrix.index }}
          path: generated/

      - name: Verify Voice Reference File (Coqui TTS Fallback)
        # generate_audio.py requires a reference WAV for Coqui.
        # If it's missing in the repo, we safely fall back to espeak-ng.
        run: |
          if [ ! -f "saem_voice_sample.wav" ]; then
            echo "::warning::saem_voice_sample.wav not found! Falling back to espeak-ng."
            echo "VOICE_BACKEND=espeak" >> $GITHUB_ENV
          else
            echo "VOICE_BACKEND=coqui" >> $GITHUB_ENV
          fi

      - name: Render + Stitch Video
        run: |
          mkdir -p output_shorts temp_audio
          python batch_runner.py \
            --csv "generated/render-${{ matrix.index }}.csv" \
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }} \
            --voice-backend ${{ env.VOICE_BACKEND }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ matrix.index }}
          path: |
            output_shorts/
            generated/*.log
          retention-days: 14
