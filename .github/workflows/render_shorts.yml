name: Validate Request-Driven Pipeline

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.csv"
      - ".github/workflows/render_shorts.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "*.py"
      - "*.csv"
      - ".github/workflows/render_shorts.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest

      - name: Run request-pipeline and renderer-adapter tests
        run: |
          pytest -q \
            test_request_pipeline.py \
            test_matrix_engine.py \
            test_problem_matrix.py \
            test_schema_validator.py \
            test_batch_runner.py \
            test_physics_engine.py
