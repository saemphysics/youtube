name: Universal Physics Video Renderer

on:
  workflow_dispatch:
    inputs:
      max_videos:
        description: "Max videos to render from request.txt (1-10)"
        type: choice
        options: [1, 2, 3, 5, 10]
        default: 3
      orientation:
        description: "Video Format"
        type: choice
        options: [vertical, horizontal]
        default: vertical
      concept_type:
        description: "Scene Type"
        type: choice
        options: [GENERIC, 3D, 3D_HELIX]
        default: GENERIC
      quality:
        description: "Render Quality"
        type: choice
        options: [draft, 720p, 1080p]
        default: draft
      voice_backend:
        description: "Voice Engine"
        type: choice
        options: [espeak, coqui]
        default: espeak
      provider:
        description: "Script Generator"
        type: choice
        options: [local, gemini]
        default: local

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Read request.txt and create the matrix
  # ─────────────────────────────────────────────────────────────────────────────
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.split.outputs.matrix }}
      count:    ${{ steps.split.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        name: Parse request.txt
        run: |
          python - <<'PY'
          import json, os
          max_vids = int("${{ github.event.inputs.max_videos }}")
          lines = [ln.strip() for ln in open("request.txt", encoding="utf-8") 
                   if ln.strip() and not ln.lstrip().startswith("#")]
          
          # Limit to user's choice
          lines = lines[:max_vids]
          
          matrix = [{"index": i, "request": ln} for i, ln in enumerate(lines)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"count={len(matrix)}\n")
          print(f"Prepared {len(matrix)} topic(s).")
          PY

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: The Brains (Generate Plan) - Lightweight, no Manim/TTS
  # ─────────────────────────────────────────────────────────────────────────────
  generate-plan:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.requests) }}
    env:
      SAEM_GENERATION_PROVIDER: ${{ github.event.inputs.provider == 'gemini' && secrets.GEMINI_API_KEY != '' && 'gemini_provider:create_provider' || 'local_provider:create_provider' }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Light Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.12.0 pypdf google-genai tqdm

      - name: Generate Plan
        env:
          REQUEST_TEXT: ${{ matrix.request }}
        run: |
          mkdir -p generated
          python request_pipeline.py \
            --request "$REQUEST_TEXT" \
            --preferences '{
              "orientation":"${{ github.event.inputs.orientation }}",
              "concept_type":"${{ github.event.inputs.concept_type }}",
              "quality":"${{ github.event.inputs.quality == 'draft' && '720p' || github.event.inputs.quality }}",
              "language":"en",
              "platform":"youtube"
            }' \
            --output "generated/plan-${{ matrix.index }}.json"

      - name: Validate & Create CSV
        run: |
          python output_pipeline.py "generated/plan-${{ matrix.index }}.json" \
            --csv-output "generated/render-${{ matrix.index }}.csv" \
            --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.index }}
          path: generated/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: The Muscle (Render Video) - Heavy dependencies
  # ─────────────────────────────────────────────────────────────────────────────
  render:
    needs: [prepare-matrix, generate-plan]
    if: ${{ !cancelled() && needs.generate-plan.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2 # XTTS needs ~4GB RAM, keep parallel low
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.requests) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Manim/TTS/FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive texlive-latex-extra texlive-fonts-extra \
            texlive-latex-recommended texlive-science tipa \
            espeak-ng sox libsndfile1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-xtts-v2-${{ runner.os }}
          restore-keys: hf-xtts-v2-

      - name: Install PyTorch (CPU) & Requirements
        run: |
          # CRITICAL: Use CPU index to avoid downloading 2GB of NVIDIA drivers
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: plan-${{ matrix.index }}
          path: generated/

      - name: Render + Stitch Video
        run: |
          mkdir -p output_shorts temp_audio
          python batch_runner.py \
            --csv "generated/render-${{ matrix.index }}.csv" \
            ${{ github.event.inputs.quality == 'draft' && '--draft' || '' }} \
            --voice-backend ${{ github.event.inputs.voice_backend }}

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.index }}
          path: output_shorts/
          retention-days: 14
