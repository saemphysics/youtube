name: Universal Physics Video Renderer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render_shorts.yml"
      - "*.py"
      - "requirements.txt"
      - "gemini_provider.py"
      - "local_provider.py"
  workflow_dispatch:
    inputs:
      topic:
        description: "Video Topic / Prompt"
        required: true
        type: string
        default: "Explain the derivative of position as velocity using calculus."
      provider:
        description: "AI Provider"
        type: choice
        options: [local, gemini]
        default: local
      orientation:
        description: "Video Format"
        type: choice
        options: [horizontal, vertical]
        default: horizontal
      quality:
        description: "Render Quality"
        type: choice
        options: [draft, 720p, 1080p]
        default: draft
      voice_backend:
        description: "Voice Engine"
        type: choice
        options: [espeak, coqui]
        default: espeak
      require_approval:
        description: "Pause for human approval before rendering?"
        type: boolean
        default: false

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: The Brains (LLM + Math Engines)
  # ─────────────────────────────────────────────────────────────────────────────
  generate-plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.require_approval && 'teacher-approval' || '' }}
    env:
      SAEM_GENERATION_PROVIDER: ${{ github.event.inputs.provider == 'gemini' && secrets.GEMINI_API_KEY != '' && 'gemini_provider:create_provider' || 'local_provider:create_provider' }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Plan-Generation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.12.0 pypdf google-genai tqdm

      - name: Generate Plan
        env:
          REQUEST_TEXT: ${{ github.event.inputs.topic }}
        run: |
          mkdir -p generated
          python request_pipeline.py \
            --request "$REQUEST_TEXT" \
            --preferences '{
              "orientation":"${{ github.event.inputs.orientation }}",
              "language":"en",
              "quality":"${{ github.event.inputs.quality == 'draft' && '720p' || github.event.inputs.quality }}",
              "audio_direction":"calm, clear narration",
              "visual_direction":"3b1b minimalist geometry"
            }' \
            --output "generated/plan.json"

      - name: Validate & Convert to CSV
        run: |
          python output_pipeline.py "generated/plan.json" \
            --csv-output "generated/render.csv" \
            --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: plan-artifacts
          path: generated/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: The Muscle (Manim + TTS + FFmpeg)
  # ─────────────────────────────────────────────────────────────────────────────
  render:
    needs: generate-plan
    if: ${{ !cancelled() && needs.generate-plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive texlive-latex-extra texlive-fonts-extra \
            texlive-latex-recommended texlive-science tipa \
            espeak-ng sox libsndfile1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache HuggingFace Models (XTTS-v2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-xtts-v2-${{ runner.os }}
          restore-keys: hf-xtts-v2-

      - name: Install PyTorch (CPU) + Full Requirements
        run: |
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Generated Plan
        uses: actions/download-artifact@v4
        with:
          name: plan-artifacts
          path: generated/

      - name: Render + Stitch Video
        run: |
          mkdir -p output_shorts temp_audio
          python batch_runner.py \
            --csv "generated/render.csv" \
            ${{ github.event.inputs.quality == 'draft' && '--draft' || '' }} \
            --voice-backend ${{ github.event.inputs.voice_backend }}

      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output_shorts/
          retention-days: 14
